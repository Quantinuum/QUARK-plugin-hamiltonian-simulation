# Run all benchmarks from a single test file because quark creates a new directory
# for running each file, but there will be name collisions for that directory if
# benchmarks ware started within the same second (directory name is derived from current time)

plugins:
    - "quark_plugin_hamiltonian_simulation"
    - "quark_plugin_quantinuum"

pipeline:
    - [
        "free_fermion_benchmark": {lx: 2, ly: 2, periodic: false, n_trot: 2, two_spin_species: false},
        "spectral_function_benchmark": {l: 4, n_trot: 10, dt: 0.5, epsilon: 0.5, n_shots: 10, mode: 'log2N'},
        "thermal_adiabatic_square_ising": {lx: 2, ly: 2, periodic: false, n_trot: 4, h: 2, dt: 0.2, },
    ]
    - "to_backend_input": {circuit_type: "qiskit"}
    - "aer_simulator"
